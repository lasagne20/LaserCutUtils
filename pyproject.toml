[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-cut-utils"
version = "0.1.0"
description = "FreeCAD utilities for laser-cut tab-and-slot joinery and SVG export"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
